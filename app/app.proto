syntax = "proto3";

package snakegame;

option csharp_namespace = "App.Protocol";

enum Direction {
  DIRECTION_UNSPECIFIED = 0;
  DIRECTION_UP = 1;
  DIRECTION_DOWN = 2;
  DIRECTION_LEFT = 3;
  DIRECTION_RIGHT = 4;
}

message PlayerInput {
  string room_id = 1;
  string player_id = 2;
  uint64 client_tick = 3;
  Direction direction = 4;
  bool use_dash = 5;
}

message Point {
  sint32 x = 1;
  sint32 y = 2;
}

message SnakeState {
  repeated Point body= 1;
  Direction direction = 2;
  bool is_alive = 3;
}

message PlayerState {
  string player_id = 1;
  string name = 2;
  SnakeState snake = 3;
  int32 score = 4;
  double survival_time = 5;
}

message FoodState {
  Point position = 1;
  int32 food_type = 2;
}

message GameState {
  string room_id = 1;
  uint64 server_tick = 2;
  uint64 max_tick = 3;
  int32 width = 4;
  int32 height = 5;
  repeated PlayerState players = 6;
  repeated FoodState foods = 7;
  int32 food_num = 8;
  bool is_over_time = 9;
}
